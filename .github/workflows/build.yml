name: Build Mod

on:
  push:
    branches:
    - rel

env:
    MOD_NAME: EvilExpansionMod

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Collect commit messages
        id: commits
        uses: actions/github-script@v7
        with:
          script: |
            const commits = context.payload.commits
              .map(c => `- ${c.message.split('\n')[0]}`)
              .join('\n');
            core.setOutput('list', commits);

      - name: Download & Install tModLoader
        run: |
          curl -s -L https://github.com/tModLoader/tModLoader/releases/latest/download/tModLoader.zip -o tModLoader.zip
          unzip -q -o tModLoader.zip -d ../tModLoader
          rm tModLoader.zip

      - name: Create tModLoader.targets file
        shell: bash
        run: |
          cat >> ../tModLoader.targets << EOF
          <Project ToolsVersion="14.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project=".\tModLoader\tMLMod.targets" />
          </Project>
          EOF

      - name: Restore mod solution
        run: dotnet restore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build mod solution
        run: dotnet build --configuration Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy .tmod release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: C:\Users\runneradmin\Documents\My Games\Terraria\tModLoader\Mods\${{ env.MOD_NAME }}.tmod
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy action across Discord
        uses: sarisia/actions-status-discord@v1  
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          nocontext: true
          title: Mod build
          description: |
            ## Changes
            ${{ steps.commits.outputs.list }}

            Download the build [here](${{ steps.create_release.outputs.url }}/${{ env.MOD_NAME }}.tmod).