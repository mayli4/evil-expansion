name: Build Mod

on:
  push:
    branches:
    - rel
  
env:
    MOD_NAME: EvilExpansionMod

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Download & Install tModLoader
        run: |
          curl -s -L https://github.com/tModLoader/tModLoader/releases/latest/download/tModLoader.zip -o tModLoader.zip
          unzip -q -o tModLoader.zip -d ../tModLoader
          rm tModLoader.zip

      - name: Create tModLoader.targets file
        shell: bash
        run: |
          cat >> ../tModLoader.targets << EOF
          <Project ToolsVersion="14.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project=".\tModLoader\tMLMod.targets" />
          </Project>
          EOF

      - name: Restore mod solution
        run: dotnet restore

      - name: Build mod solution
        run: dotnet build --configuration Release

      - name: Deploy .tmod artifact
        id: upload_tmod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}.tmod
          path: C:\Users\runneradmin\Documents\My Games\Terraria\tModLoader\Mods\${{ env.MOD_NAME }}.tmod

      - name: Deploy action across Discord
        uses: sarisia/actions-status-discord@v1  
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          nocontext: true
          title: Mod build
          description: |
            Download the build [here](${{ steps.upload_tmod.outputs.artifact-url }}).